<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE WAY OUT — Sala de Espera</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link href="lobby-styles.css" rel="stylesheet">
</head>
<body>
<div class="screen">
  <div class="stain" style="width:220px;height:120px;top:72%;left:6%;"></div>
  <div class="stain" style="width:170px;height:170px;top:6%;right:6%;"></div>

  <div class="header text-center"><h1>SALA DE ESPERA</h1></div>

  <div class="room-code text-center">
    <div class="label">CÓDIGO DE SALA</div>
    <div class="code">7F3K</div>
  </div>

  <div class="layout d-flex flex-column">
    <div class="list-head"><span>JUGADOR</span><span>ESTADO</span></div>
    <div class="players" id="players">
      <div class="player-row you">
        <span class="name">TÚ</span>
        <span class="status ready">LISTO</span>
      </div>
      <div class="player-row">
        <span class="name">wanderer77</span>
        <span class="status ready">LISTO</span>
      </div>
      <div class="player-row">
        <span class="name">yellow.static</span>
        <span class="status waiting">ESPERANDO</span>
      </div>
      <div class="player-row empty">
        <span class="name">ESPERANDO JUGADOR...</span>
        <span class="status waiting">—</span>
      </div>
    </div>
  </div>

  <div class="footer-actions d-flex">
    <button class="warn" onclick="window.location.href='index.html'">SALIR DE LA SALA</button>
    <button class="primary" onclick="window.location.href='laberinto.html?modo=multi'">INICIAR PARTIDA</button>
  </div>

  <div class="flavor" id="flavor">3 DE 4 JUGADORES CONECTADOS</div>

  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="lobby-script.js"></script>
</body>
</html>
