<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE WAY OUT — Iniciar sesión</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link href="styles.css" rel="stylesheet">
<link href="login-styles.css" rel="stylesheet">
</head>
<body data-musica="menu">

<div class="screen">

  <div class="classify">
    NIVEL <b>0</b><br>
    IDENTIFICACIÓN REQUERIDA
  </div>

  <div class="titleblock text-center">
    <h1 class="title">ONE WAY<br>OUT</h1>
    <div class="subtitle">SOLO UNO ENCUENTRA LA SALIDA</div>
  </div>

  <form class="panel login-panel" id="formulario" autocomplete="off">
    <label for="nombre">NOMBRE DE JUGADOR</label>
    <input type="text" id="nombre" maxlength="20" placeholder="ESCRIBE TU NOMBRE" autofocus>
    <button type="submit" class="btn-login primary">ENTRAR</button>

    <div class="separador">— O —</div>

    <button type="button" class="btn-login facebook" id="btnFacebook">CONTINUAR CON FACEBOOK</button>
    <div id="msg" role="alert"></div>
  </form>

  <div class="footer-note">TU NOMBRE APARECERÁ EN EL RANKING SI ESCAPAS</div>
</div>

<script src="audio.js"></script>
<script src="login-script.js"></script>
</body>
</html>
