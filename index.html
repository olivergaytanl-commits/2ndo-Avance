<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@v0.155.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
    }
  }
</script>
</head>

<body>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script type="module">

    import * as THREE from 'three';

    var rotarY = 10.0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    //Cuadrado
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshPhongMaterial({ color: 0x00ff00, shininess: 100 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube)

    // Circulito
    const geometry2 = new THREE.SphereGeometry(0.7, 32, 32);
    const material2 = new THREE.MeshPhongMaterial({ color: 0xff0000, shininess: 100 });
    const cube2 = new THREE.Mesh(geometry2, material2);
    cube2.position.x = 2.5;
    scene.add(cube2);

    // Una dona
    const geometry3 = new THREE.TorusGeometry(0.6, 0.25, 16, 100);
    const material3 = new THREE.MeshPhongMaterial({ color: 0x0000ff, shininess: 100 });
    const cube3 = new THREE.Mesh(geometry3, material3);
    cube3.position.x = -2.5;
    scene.add(cube3);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffaacc, 0.8); //  Pa la luz
    scene.add(ambientLight);

    const dl = new THREE.DirectionalLight(0xffffff, 1.5);
    dl.position.set(10, 0, 0);
    scene.add(dl);

    const pl = new THREE.PointLight(0x00ffff, 15, 100);
    pl.position.set(0, 3, -2);
    scene.add(pl);

    camera.position.z = 8;
    //camera.position.x = -2;
    camera.position.y = 2.5;

    var posicionCubo = new THREE.Vector3(0, 0.2, -1);

    renderer.setAnimationLoop(animate);

    function animate(time) {

      
      const t = time * 0.0005; // Pa la velocidad
      cube.position.x = Math.sin(t) * 10;

      // El PointLight comparte la posición del cubo
      pl.position.x = cube.position.x;
      pl.position.y = cube.position.y;
      pl.position.z = cube.position.z;

      renderer.render(scene, camera);

    }


    document.addEventListener('keydown', (event) => {

      if (event.key === 'a') {
        cube.position.x -= 1;
      }
      if (event.key === 'd') {
        cube.position.x += 1;
      }
      if (event.key === 'w') {
        cube.position.z -= 1;
      }
      if (event.key === 's') {
        cube.position.z += 1;
      }

    });


  </script>
</body>

</html>
