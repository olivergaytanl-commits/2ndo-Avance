<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE WAY OUT — Configuración</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<div class="screen">
  <div class="stain" style="width:220px;height:120px;top:70%;left:6%;"></div>
  <div class="stain" style="width:160px;height:160px;top:8%;right:6%;"></div>

  <div class="header text-center"><h1>CONFIGURACIÓN</h1></div>

  <div class="layout d-flex flex-column">
    <div class="tabs d-flex">
      <div class="tab active">GENERAL</div>
    </div>

    <div class="content">
      <div class="setting-row d-flex justify-content-between align-items-center">
        <span class="row-label">MÚSICA</span>
        <!--<input type="range" class="slider" value="70">-->
        <input type="range" class="slider" id="volMusica" min="0" max="100" step="1" value="70">
      </div>
      <div class="setting-row d-flex justify-content-between align-items-center">
        <span class="row-label">EFECTOS DE SONIDO</span>
        <!--<input type="range" class="slider" value="85">-->
        <input type="range" class="slider" id="volEfectos" min="0" max="100" step="1" value="85">
      </div>
      <!-- 
      <div class="setting-row d-flex justify-content-between align-items-center">
        <span class="row-label">VOCES / AVISOS</span>
        <input type="range" class="slider" value="60">
      </div>
      <div class="setting-row d-flex justify-content-between align-items-center">
        <span class="row-label">SONIDO AL ACERCARSE OTRO JUGADOR</span>
        <div class="toggle on"><div class="knob"></div></div>
      </div>
      <div class="setting-row d-flex justify-content-between align-items-center">
        <span class="row-label">IDIOMA</span>
        <div class="select-value d-flex align-items-center">
          <span class="arrow">‹</span>
          <span>ESPAÑOL</span>
          <span class="arrow">›</span>
        </div>
      </div>
      -->
    </div>

    <div class="footer-actions d-flex">
      <!--<button>RESTABLECER</button>
      <button class="primary" onclick="window.location.href='index.html'">GUARDAR</button>-->
      <button id="btnRestablecer">RESTABLECER</button>
      <button class="primary" id="btnGuardar">GUARDAR</button>
    </div>
  </div>

  <div class="back">ESC PARA VOLVER</div>

  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<script src="audio.js"></script>
<body data-musica="menu"></body>
<!-- volumen de audio -->
<script>
  const sliderMusica  = document.getElementById('volMusica');
  const sliderEfectos = document.getElementById('volEfectos');

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      window.location.href = 'index.html';
    }
  });

  // Cargar lo guardado en los sliders
  sliderMusica.value  = ajustes.musica;
  sliderEfectos.value = ajustes.efectos;

  // Vista previa en vivo de la música
  sliderMusica.addEventListener('input', () => {
    musica.volume = sliderMusica.value / 100;
  });

  // Guardar y volver al menú
  document.getElementById('btnGuardar').addEventListener('click', () => {
    guardarAjustes({
      musica:  Number(sliderMusica.value),
      efectos: Number(sliderEfectos.value)
    });
    window.location.href = 'index.html';
  });

  // Restablecer a los valores por defecto
  document.getElementById('btnRestablecer').addEventListener('click', () => {
    sliderMusica.value  = AJUSTES_DEFAULT.musica;
    sliderEfectos.value = AJUSTES_DEFAULT.efectos;
    musica.volume = AJUSTES_DEFAULT.musica / 100;
  });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
