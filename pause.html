<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE WAY OUT — Pausa</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link href="pause-styles.css" rel="stylesheet">
</head>
<body>

<div class="screen">
  <div class="game-behind">
    <div class="stain" style="width:220px;height:120px;top:55%;left:10%;"></div>
    <div class="stain" style="width:180px;height:180px;top:15%;right:12%;"></div>
  </div>
  <div class="dim"></div>

  <div class="hud">
    TIEMPO <b id="t">03:41</b><br>
    JUGADORES RESTANTES: <b>2</b>
  </div>

  <div class="pausebox text-center">
    <h1 class="pause-title">PAUSA</h1>

    <div class="panel d-flex flex-column">
      <button class="btn-menu primary d-flex justify-content-between align-items-center" onclick="window.location.href='gameplay.html'">
        REANUDAR <span class="tag">ESC</span>
      </button>
      <button class="btn-menu warn d-flex justify-content-between align-items-center" onclick="window.location.href='index.html'">
        ABANDONAR PARTIDA <span class="tag">SALIR AL MENÚ</span>
      </button>
    </div>
  </div>

  <div class="grain"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="pause-script.js"></script>
</body>
</html>
